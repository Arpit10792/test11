<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Styled Website</title>
    <!-- This line links your CSS file to this HTML file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- This element will be styled by the #main-banner ID rule -->
    <div id="main-banner">
        <h1>Welcome to My Website</h1>
    </div>

    <p>This is a normal paragraph using the default body font and color.</p>

    <!-- This paragraph uses the .highlight-text class rule -->
    <p class="highlight-text">This text is important and will stand out!</p>

</body>
</html>
